name: Deploy Enemy Basic Idle Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out known-good main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Check out sprite-sheet test branch
        uses: actions/checkout@v4
        with:
          ref: test/enemy-basic-idle-sheet
          path: test-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install known-good dependencies
        working-directory: main-src
        run: npm ci

      - name: Rewrite known-good asset URLs for the normal Pages root
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("main-src/index.html")]
          files.extend(
              path
              for path in Path("main-src/src").rglob("*")
              if path.is_file() and path.suffix.lower() in {".ts", ".tsx", ".js", ".jsx", ".css", ".json", ".html"}
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace("/assets/", "/starfire-armada-premium/assets/"),
                  encoding="utf-8",
              )
          PY

      - name: Build known-good game
        working-directory: main-src
        run: npm run build

      - name: Install test dependencies
        working-directory: test-src
        run: npm ci

      - name: Rewrite test asset URLs for the isolated preview path
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("test-src/index.html")]
          files.extend(
              path
              for path in Path("test-src/src").rglob("*")
              if path.is_file() and path.suffix.lower() in {".ts", ".tsx", ".js", ".jsx", ".css", ".json", ".html"}
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace(
                      "/assets/",
                      "/starfire-armada-premium/enemy-sheet-test/assets/",
                  ),
                  encoding="utf-8",
              )
          PY

      - name: Build sprite-sheet test game
        working-directory: test-src
        run: npm run build

      - name: Assemble normal site and isolated preview
        run: |
          mkdir -p site/enemy-sheet-test
          cp -R main-src/dist/. site/
          cp -R test-src/dist/. site/enemy-sheet-test/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy combined preview site
        id: deployment
        uses: actions/deploy-pages@v4
