name: Deploy Clean Enemy Idle Preview

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out known-good main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Check out clean enemy-frame branch
        uses: actions/checkout@v4
        with:
          ref: test/enemy-basic-idle-clean-v2
          path: test-src

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install known-good dependencies
        working-directory: main-src
        run: npm ci

      - name: Rewrite known-good asset URLs for the normal Pages root
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("main-src/index.html")]
          files.extend(
              path
              for path in Path("main-src/src").rglob("*")
              if path.is_file()
              and path.suffix.lower()
              in {".ts", ".tsx", ".js", ".jsx", ".css", ".json", ".html"}
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace(
                      "/assets/",
                      "/starfire-armada-premium/assets/",
                  ),
                  encoding="utf-8",
              )
          PY

      - name: Build known-good game
        working-directory: main-src
        run: npm run build

      - name: Install clean-test dependencies
        working-directory: test-src
        run: npm ci

      - name: Restore verified complete enemy frames
        working-directory: test-src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="public/assets/ui-v2/gameplay/rapid-fire-premium/animations/enemy_basic_idle_frames"
          mkdir -p "$root"

          fetch_blob() {
            local sha="$1"
            local output="$2"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$output"
          }

          fetch_blob 5cfe9964b83213a41e11cbacd3c05ed7438ca2ef "$root/enemy_basic_idle_01.png"
          fetch_blob a4a2591a7aae0146a1ba254292ba6744668e2ff1 "$root/enemy_basic_idle_02.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_03.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_04.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_05.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_06.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_07.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_08.png"

      - name: Rewrite clean-test asset URLs for the isolated preview path
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path("test-src/index.html")]
          files.extend(
              path
              for path in Path("test-src/src").rglob("*")
              if path.is_file()
              and path.suffix.lower()
              in {".ts", ".tsx", ".js", ".jsx", ".css", ".json", ".html"}
          )
          for path in files:
              text = path.read_text(encoding="utf-8")
              path.write_text(
                  text.replace(
                      "/assets/",
                      "/starfire-armada-premium/enemy-idle-clean-v2/assets/",
                  ),
                  encoding="utf-8",
              )
          PY

      - name: Generate and type-check clean test
        working-directory: test-src
        run: npm run typecheck

      - name: Build already-generated clean test
        working-directory: test-src
        run: npx vite build

      - name: Assemble normal site and isolated clean preview
        run: |
          mkdir -p site/enemy-idle-clean-v2
          cp -R main-src/dist/. site/
          cp -R test-src/dist/. site/enemy-idle-clean-v2/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy combined clean preview site
        id: deployment
        uses: actions/deploy-pages@v4
