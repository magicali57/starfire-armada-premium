name: Inspect Enemy Spritesheet Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate asset preload and animation registry usage
        run: |
          set -euo pipefail
          echo '=== animation registry usage ==='
          grep -RFn 'RAPID_FIRE_PREMIUM_ANIMATION_SHEETS' src || true
          echo '=== static registry usage ==='
          grep -RFn 'RAPID_FIRE_PREMIUM_ASSETS' src || true
          echo '=== image preload helpers ==='
          grep -RFnE 'preload|loadImages|HTMLImageElement|new Image' src/gameplay src/screens src/components 2>/dev/null | head -n 250 || true
          echo '=== rapidFire files ==='
          find src -path '*rapidFire*' -type f -print | sort
