name: Test Enemy Basic Idle Sheet

on:
  push:
    branches:
      - test/enemy-basic-idle-sheet
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check patched renderer
        run: npm run typecheck

      - name: Build patched game
        run: npm run build
