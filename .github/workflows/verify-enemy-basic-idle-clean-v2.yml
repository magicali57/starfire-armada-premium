name: Verify Clean Enemy Idle Frames

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean test branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify eight independent PNG frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct

          root = Path(
              "public/assets/ui-v2/gameplay/rapid-fire-premium/animations/"
              "enemy_basic_idle_frames"
          )
          files = sorted(root.glob("enemy_basic_idle_*.png"))
          if len(files) != 8:
              raise SystemExit(f"Expected 8 PNG frames, found {len(files)}")

          for path in files:
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path.name}: invalid PNG signature")
              width, height, bit_depth, color_type = struct.unpack(
                  ">IIBB", data[16:26]
              )
              if (width, height) != (128, 128):
                  raise SystemExit(
                      f"{path.name}: expected 128x128, got {width}x{height}"
                  )
              if bit_depth != 8 or color_type not in {4, 6}:
                  raise SystemExit(
                      f"{path.name}: expected 8-bit alpha PNG, "
                      f"got bit depth {bit_depth}, color type {color_type}"
                  )
          PY

      - name: Generate isolated preview sources
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$({
            node scripts/applyEnemyIdlePreviewEnergy.mjs
            node scripts/runEnemyBasicIdleCleanV2.mjs
            node scripts/fixEnemyBasicIdleCanvasType.mjs
          } 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if [ -n "$PR_NUMBER" ]; then
              printf 'Enemy preview source generation failed:\n\n```text\n%s\n```\n' "$output" \
                | gh pr comment "$PR_NUMBER" --body-file -
            fi
            exit "$status"
          fi

      - name: Type-check generated renderer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$(npx tsc -b --noEmit 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if [ -n "$PR_NUMBER" ]; then
              printf 'Enemy preview TypeScript check failed:\n\n```text\n%s\n```\n' "$output" \
                | gh pr comment "$PR_NUMBER" --body-file -
            fi
            exit "$status"
          fi

      - name: Build generated test game
        run: npx vite build
