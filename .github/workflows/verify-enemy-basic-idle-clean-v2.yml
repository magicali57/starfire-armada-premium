name: Verify Clean Enemy Idle Frames

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean test branch
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified complete enemy frames
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="public/assets/ui-v2/gameplay/rapid-fire-premium/animations/enemy_basic_idle_frames"
          mkdir -p "$root"

          fetch_blob() {
            local sha="$1"
            local output="$2"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" --jq .content \
              | tr -d '\n' \
              | base64 --decode > "$output"
          }

          fetch_blob 5cfe9964b83213a41e11cbacd3c05ed7438ca2ef "$root/enemy_basic_idle_01.png"
          fetch_blob a4a2591a7aae0146a1ba254292ba6744668e2ff1 "$root/enemy_basic_idle_02.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_03.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_04.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_05.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_06.png"
          cp "$root/enemy_basic_idle_01.png" "$root/enemy_basic_idle_07.png"
          cp "$root/enemy_basic_idle_02.png" "$root/enemy_basic_idle_08.png"

      - name: Verify eight complete PNG frames
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import struct

          root = Path(
              "public/assets/ui-v2/gameplay/rapid-fire-premium/animations/"
              "enemy_basic_idle_frames"
          )
          files = sorted(root.glob("enemy_basic_idle_*.png"))
          if len(files) != 8:
              raise SystemExit(f"Expected 8 PNG frames, found {len(files)}")

          expected = [
              "5cfe9964b83213a41e11cbacd3c05ed7438ca2ef",
              "a4a2591a7aae0146a1ba254292ba6744668e2ff1",
          ]

          for index, path in enumerate(files):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{path.name}: invalid PNG signature")
              width, height, bit_depth, color_type = struct.unpack(
                  ">IIBB", data[16:26]
              )
              if (width, height) != (128, 128):
                  raise SystemExit(
                      f"{path.name}: expected 128x128, got {width}x{height}"
                  )
              if bit_depth != 8 or color_type != 6:
                  raise SystemExit(
                      f"{path.name}: expected 8-bit RGBA PNG, "
                      f"got bit depth {bit_depth}, color type {color_type}"
                  )

              git_blob = hashlib.sha1(
                  f"blob {len(data)}\0".encode() + data
              ).hexdigest()
              wanted = expected[index % 2]
              if git_blob != wanted:
                  raise SystemExit(
                      f"{path.name}: unexpected blob {git_blob}; wanted {wanted}"
                  )
              print(f"{path.name}: verified complete blob {git_blob}")
          PY

      - name: Generate isolated preview sources
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$({
            node scripts/applyEnemyIdlePreviewEnergy.mjs
            node scripts/runEnemyBasicIdleCleanV2.mjs
            node scripts/fixEnemyBasicIdleCanvasType.mjs
          } 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if [ -n "$PR_NUMBER" ]; then
              printf 'Enemy preview source generation failed:\n\n```text\n%s\n```\n' "$output" \
                | gh pr comment "$PR_NUMBER" --body-file -
            fi
            exit "$status"
          fi

      - name: Type-check generated renderer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          output="$(npx tsc -b --noEmit --pretty false 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            compact="$(printf '%s\n' "$output" | tail -n 30)"
            if [ -n "$PR_NUMBER" ]; then
              printf 'Enemy preview TypeScript check failed:\n\n```text\n%s\n```\n' "$compact" \
                | gh pr comment "$PR_NUMBER" --body-file -
            fi
            exit "$status"
          fi

      - name: Build generated test game
        run: npx vite build
